# Company career boards with public job APIs (no key, no login): Greenhouse, Lever, Ashby, SmartRecruiters.
# slug = the board name in the career-page URL, e.g. jobs.lever.co/<slug>.
# Only India / remote-India roles with entry-level or frontend titles are kept.
# Every slug below answered the API on 2026-09-26. Add your own; a dead slug is just skipped with a warning.

